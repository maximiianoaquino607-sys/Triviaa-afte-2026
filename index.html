<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIVIA AFTE 2026</title>
<style>
body{margin:0;font-family:Arial;background:#2d0a5e;color:white;min-height:100vh;display:flex;justify-content:center;padding:15px}
.card{background:white;color:#222;border-radius:20px;padding:20px;max-width:500px;width:100%;margin-top:20px;border:4px solid #ffd700}
h1{color:#ffd700;text-align:center;margin:0;font-size:26px}
.sub{color:#ffd700;text-align:center;font-size:14px;margin-bottom:15px}
.q{background:#6a1b9a;color:white;padding:12px;border-radius:12px;text-align:center;margin-bottom:12px;font-weight:bold}
.opts{display:grid;gap:10px}
.opt{background:#f3f3f3;border:2px solid #ddd;padding:12px;border-radius:10px;cursor:pointer}
.opt:hover{background:#e1bee7}
.bar{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:10px 0}
.bar div{height:100%;background:#00c853;width:100%;transition:width 1s}
.score{text-align:center;margin-top:10px;font-size:13px;color:#666}
.btn{background:#ffd700;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>⭐ TRIVIA AFTE 2026</h1>
<div class="sub">50 preguntas - EES N°15</div>
<div id="game"></div>
</div>
<script>
const qs=[
["Matemática","¿15% de 200?",["25","30","35","20"],1],
["Matemática","¿Raíz de 144?",["11","12","13","14"],1],
["Matemática","¿7x8?",["54","56","64","58"],1],
["Historia","¿Revolución de Mayo?",["1806","1810","1816","1820"],1],
["Geografía","¿Capital Argentina?",["Córdoba","Buenos Aires","Rosario","La Plata"],1],
["Lengua","Sinónimo de alegre",["Triste","Contento","Enojado","Cansado"],1],
["Ciencias","¿Planetas sistema solar?",["7","8","9","10"],1],
["AFTE","¿Qué significa AFTE?",["Arte","Administración Formación Trabajo Empleo","Agronomía","Ninguna"],1],
["AFTE","¿Qué se muestra en Muestra Anual?",["Proyectos","Exámenes","Deportes","Nada"],0],
["Matemática","¿60+60+60?",["120","180","90","360"],1]
];
for(let i=10;i<50;i++){qs.push(["General",`Pregunta ${i+1}: ¿Respuesta correcta?`,["A","B (Correcta)","C","D"],1])}
let idx=0,pts=0,time=25,t;
function render(){
if(idx>=qs.length){document.getElementById('game').innerHTML=`<h2 style='text-align:center'>¡Terminaste! 🏆</h2><p style='text-align:center'>Puntaje: ${pts}/50</p><button class='btn' onclick='location.reload()'>Jugar de nuevo</button>`;return}
let q=qs[idx];
document.getElementById('game').innerHTML=`<div class='q'>${q[0]} - ${idx+1}/50<br>${q[1]}</div><div class='bar'><div id='b'></div></div><div class='opts'>${q[2].map((o,i)=>`<div class='opt' onclick='ans(${i})'>${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div><div class='score'>Puntos: ${pts} | Tiempo: <span id='tm'>25</span>s</div>`;
time=25;clearInterval(t);t=setInterval(()=>{time--;document.getElementById('tm').textContent=time;document.getElementById('b').style.width=time/25*100+'%';if(time<=0)ans(-1)},1000);
}
function ans(i){clearInterval(t);if(i===qs[idx][3])pts++;idx++;render();}
render();
</script>
</body>
</html>
