argin-top:14px;color:#A5B4FC;font-size:11px}</style></head><body id="bodyBg" class="bg-Matematica"><div class="header-top"><h1>⭐ TRIVIA AFTE 2026</h1><p>50 preguntas · EES N°15</p></div><div class="main-card"><div class="info-bar"><span id="materiaLabel">.</span><span>⏱ <span id="time">25</span>s</span><span id="progress">1/50</span></div><div class="q-header m-Matematica" id="qHeader"><span id="qTitle">.</span><span>25s</span></div><div class="q-text" id="qText">.</div><div class="options" id="options"></div><button class="btn-next" id="nextBtn" onclick="nextQ()">Siguiente →</button><div class="progress-dots" id="dots"></div></div><div class="footer">Muestra Anual AFTE 2026</div><script>const preguntas=[{materia:"Matemática", q:"Luna tiene 3 remeras y 2 pantalones. ¿De cuántas maneras diferentes puede combinar una remera con un pantalón?", opts:["5 combinaciones.","6 combinaciones.","8 combinaciones.","9 combinaciones."], correct:1},

{materia:"Ciencias Naturales", q:"¿Por qué la reproducción se considera una función vital si podemos vivir sin reproducirnos?", opts:["Porque todas las personas deben tener hijos.","Porque permite que una persona viva más años.","Porque es necesaria para la continuidad de las especies.","Porque impide que los seres vivos envejezcan."], correct:2},{materia:"Ciencias Sociales", q:"¿Para qué nos sirve estudiar Ciencias Sociales en la actualidad?", opts:["Para memorizar fechas sin relacionarlas con el presente.","Para conocer solamente la vida de personajes famosos.","Para comprender por qué ocurren ciertos cambios en la sociedad.","Para aprender únicamente cómo eran las sociedades antiguas."], correct:2},

{materia:"Ciencias Sociales", q:"¿Qué nos dice la pirámide sobre la población?", opts:["Que hay muchos nacimientos y muchas personas mayores.","Que la mayoría de la población es adulta.","Que hay pocos niños y muchos adultos mayores.","Que hay muchos adultos jóvenes y pocos niños."], correct:1},

{materia:"Ciencias Sociales", q:"¿Qué diferencia hay entre tiempo atmosférico y clima?", opts:["Son lo mismo.","El tiempo es lo que pasa en un momento, el clima es el promedio de muchos años.","El clima cambia cada hora.","El tiempo atmosférico es lo que pasa en muchos años."], correct:1},
{materia:"Ciencias Sociales", q:"¿Por qué el trabajo es importante en nuestra sociedad?", opts:["Porque solo sirve para ganar dinero.","Porque organiza la vida de las personas y produce lo que necesitamos.","Porque solo trabajan los adultos.","Porque no tiene relación con el ambiente."], correct:1},
{materia:"Ciencias Sociales", q:"¿Qué es una norma?", opts:["Una regla que organiza la convivencia.","Una opinión personal.","Una canción.","Un juego."], correct:0},

{materia:"Artística", q:"¿Qué es el punto de fuga en dibujo?", opts:["El lugar donde se esconden los colores.","El punto donde las líneas parecen juntarse a lo lejos.","El lugar donde se firma la obra.","El punto donde se mezclan todos los materiales."], correct:1},

{materia:"Artística", q:"¿Qué diferencia hay entre color primario y secundario?", opts:["No hay diferencia.","Primarios no se pueden hacer mezclando, secundarios sí.","Secundarios no se pueden hacer.","Todos son primarios."], correct:1},

function getCls(m){m=m.toLowerCase();if(m.includes('matem'))return{h:'m-Matematica',bg:'bg-Matematica'};if(m.includes('naturales'))return{h:'m-Ciencias',bg:'bg-Ciencias'};if(m.includes('sociales'))return{h:'m-Sociales',bg:'bg-Sociales'};if(m.includes('art'))return{h:'m-Artistica',bg:'bg-Artistica'};return{h:'m-Lengua',bg:'bg-Lengua'};}
let idx=0,time=25,timerInt=null,score=0,answered=false;
function dots(){let c=document.getElementById('dots');c.innerHTML='';for(let i=0;i<preguntas.length;i++){let d=document.createElement('div');d.className='dot '+(i<idx?'done':(i==idx?'active':''));c.appendChild(d);}}
function render(){answered=false;let p=preguntas[idx];let cls=getCls(p.materia);document.getElementById('bodyBg').className=cls.bg;document.getElementById('qHeader').className='q-header '+cls.h;document.getElementById('materiaLabel').innerText=p.materia+' - '+(idx+1);document.getElementById('qTitle').innerText=p.materia.toUpperCase()+' - PREGUNTA '+(idx+1);document.getElementById('qText').innerText=p.q;document.getElementById('progress').innerText=(idx+1)+'/'+preguntas.length;let cont=document.getElementById('options');cont.innerHTML='';p.opts.forEach((o,i)=>{let b=document.createElement('button');b.innerHTML=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>check(i,b);cont.appendChild(b);});document.getElementById('nextBtn').style.display='none';dots();time=25;document.getElementById('time').innerText=time;clearInterval(timerInt);timerInt=setInterval(()=>{time--;document.getElementById('time').innerText=time;if(time<=0){clearInterval(timerInt);if(!answered)lock();}},1000);}
function check(i,btn){if(answered)return;answered=true;clearInterval(timerInt);let corr=preguntas[idx].correct;let all=document.querySelectorAll('#options button');all.forEach(b=>b.disabled=true);if(i==corr){btn.classList.add('correct');score++;}else{btn.classList.add('wrong');all[corr].classList.add('correct');}document.getElementById('nextBtn').style.display='block';}
function lock(){answered=true;let all=document.querySelectorAll('#options button');all.forEach(b=>b.disabled=true);let corr=preguntas[idx].correct;if(all[corr])all[corr].classList.add('correct');document.getElementById('nextBtn').style.display='block';}
function nextQ(){idx++;if(idx>=preguntas.length){clearInterval(timerInt);let pct=Math.round(score/preguntas.length*100);let msg=pct>=80?'¡Excelente! 🌟':pct>=60?'¡Muy bien! 👏':pct>=40?'¡Buen intento! 💪':'¡A seguir! 📚';document.querySelector('.main-card').innerHTML='<div style="text-align:center;padding:24px"><h2 style="color:#4C1D95">'+msg+'</h2><p style="margin:14px 0;font-weight:800;font-size:18px;color:#4C1D95">Puntaje: '+score+' / '+preguntas.length+' ('+pct+'%)</p><button onclick="location.reload()" style="margin-top:16px;background:#7C3AED;color:white;border:none;padding:12px 24px;border-radius:999px;font-weight:900;width:100%">Jugar de nuevo</button></div>';return;}render();}
